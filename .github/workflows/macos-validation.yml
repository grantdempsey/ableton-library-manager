name: macOS release validation

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: macos-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Record native runtime
        run: |
          uname -m
          sw_vers
          bash -n Launch-Mac.command
          python -c "import sysconfig; print('Python deployment target:', sysconfig.get_config_var('MACOSX_DEPLOYMENT_TARGET'))"
          python -c "import tkinter; r=tkinter.Tk(); print(r.tk.call('info','patchlevel')); r.destroy()"
      - name: Test with a disposable home
        shell: bash
        timeout-minutes: 5
        run: |
          export HOME="$(mktemp -d)"
          mkdir -p "$HOME/Music/Ableton/User Library"
          python -u -c "import faulthandler, unittest; faulthandler.dump_traceback_later(180, repeat=True); result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover('tests')); raise SystemExit(not result.wasSuccessful())"
      - name: Build native app
        run: |
          python -m pip install -r requirements-build.txt
          python build_app.py
      - name: Smoke native app with fresh and legacy profiles
        shell: bash
        timeout-minutes: 5
        run: |
          app="$(find release_builds -path '*/dist/AbletonLibraryManager.app' -type d -print -quit)"
          test -n "$app"
          file "$app/Contents/MacOS/AbletonLibraryManager"
          export HOME="$(mktemp -d)"
          mkdir -p "$HOME/Music/Ableton/User Library"
          python -u -c "import faulthandler, runpy; faulthandler.dump_traceback_later(180, repeat=True); runpy.run_path('tests/verify_windows_bundle.py', run_name='__main__')" "$app"
          python tests/smoke_macos_package.py "$app"
